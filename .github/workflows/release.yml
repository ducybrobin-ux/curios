name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.0.0)"
        required: true
      changelog:
        description: "Notes de version"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Déterminer la version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build distributions
        run: node tools/build.mjs --target all

      - name: Créer les archives
        run: |
          cd dist
          tar -czf curios-${{ steps.version.outputs.version }}-linux.tar.gz curios-linux/
          zip -r curios-${{ steps.version.outputs.version }}-windows.zip curios-windows/
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curios-${{ steps.version.outputs.version }}
          path: |
            dist/curios-${{ steps.version.outputs.version }}-linux.tar.gz
            dist/curios-${{ steps.version.outputs.version }}-windows.zip
            dist/curios-linux/
            dist/curios-windows/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Curi>s v${{ steps.version.outputs.version }}
          body: |
            ## Curi>s v${{ steps.version.outputs.version }}
            
            ${{ github.event.inputs.changelog || 'Release automatisée' }}
            
            ### Installation
            
            **Windows** : Télécharger `curios-${{ steps.version.outputs.version }}-windows.zip`, extraire, puis lancer `lancer-curios.bat`
            
            **Linux / Raspberry Pi** :
            ```bash
            tar -xzf curios-${{ steps.version.outputs.version }}-linux.tar.gz
            cd curios-linux
            ./lancer-curios.sh
            ```
            
            ### Contenu
            
            - 11 packs de contenu (dont le pack démo)
            - Design system unique + navigation unifiée (Jouer / Parcours / Créer / Piloter / Hub)
            - Studio de création + Éditeur + Atelier de packs
            - Dashboard organisateur temps réel
            - CURIOS Project Hub (stats câblées sur les données du serveur)
            - Mode hors-ligne
            
            ### Documentation
            
            Voir [docs/GUIDE_FORMATEUR.md](docs/GUIDE_FORMATEUR.md)
          files: |
            dist/curios-${{ steps.version.outputs.version }}-linux.tar.gz
            dist/curios-${{ steps.version.outputs.version }}-windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
