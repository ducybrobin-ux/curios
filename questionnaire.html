<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c3b2e">
  <title>Curi🧭s — Questionnaire de test</title>
  <link rel="icon" href="img/icon.svg">
  <link rel="stylesheet" href="css/curios-tokens.css">
  <link rel="stylesheet" href="css/curios-design-system.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { padding-bottom: 30px; }
    .q-wrap { max-width: 680px; margin: 0 auto; padding: 16px; }
    .q-langs { display: flex; gap: 8px; margin: 10px 0 16px; }
    .q-lang-btn {
      flex: 0 0 auto; padding: 8px 14px; border-radius: 12px; font-size: 16px; font-weight: 700;
      border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
    }
    .q-lang-btn.sel { border-color: var(--primary); background: var(--card-soft); }
    fieldset.q-sec {
      border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 16px;
      background: var(--card);
    }
    legend { font-weight: 800; padding: 0 8px; font-size: 16px; color: var(--primary); }
    .q-item { margin: 12px 0; }
    .q-item .q-txt { font-weight: 600; margin: 0 0 6px; display: block; font-size: 15px; }
    .q-opt { display: flex; flex-wrap: wrap; gap: 6px; }
    .q-opt label {
      border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px;
      cursor: pointer; background: var(--card-soft); touch-action: manipulation;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .q-opt label.on { border-color: var(--primary); background: var(--card-soft); font-weight: 700; }
    .q-opt input { display: none; }
    .q-rate { display: flex; gap: 8px; }
    .q-rate label {
      flex: 1; text-align: center; padding: 12px 0; border: 2px solid var(--line); border-radius: 10px;
      cursor: pointer; font-size: 15px; background: var(--card-soft); touch-action: manipulation;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .q-rate label.on { border-color: var(--gold); background: var(--card-soft); font-weight: 800; }
    .q-rate input { display: none; }
    .q-text, .q-short { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-family: inherit; font-size: 15px; }
    .q-text { resize: vertical; min-height: 70px; }
    .q-dict-row { display: flex; gap: 6px; align-items: flex-start; }
    .q-dict-row textarea, .q-dict-row input { flex: 1; min-width: 0; }
    .q-dict-row .dict-btn { width: 44px; height: 44px; }
    .q-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .q-meta-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-muted); }
    .q-meta-grid input, .q-meta-grid select {
      padding: 9px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px;
    }
    .q-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
    .q-report {
      margin-top: 10px; padding: 12px; display: block; background: var(--card); border: 2px solid var(--line);
      border-radius: 14px; font-family: Consolas, Menlo, monospace; font-size: 12px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word; max-height: 50vh; overflow: auto; text-align: left;
    }
    .q-done { margin-top: 14px; padding: 16px; border-radius: 14px; background: var(--card-soft); border: 2px solid var(--ok); text-align: center; font-size: 16px; }
  </style>
</head>
<body>
  <main class="q-wrap">
    <h1 id="q-title" class="dash-title">🧪 Questionnaire de test</h1>
    <p id="q-intro" class="dash-sub">Merci d'avoir testé le jeu ! Vos réponses (et le rapport technique automatique) nous aident à améliorer l'application.</p>
    <div class="q-langs">
<button type="button" class="q-lang-btn" data-qlang="fr">🇫🇷 Français</button>
    </div>

    <section class="dash-card">
      <h2 id="m-title">📋 Contexte du test</h2>
      <div class="q-meta-grid">
        <label id="l-date">Date<input type="text" id="m-date" readonly></label>
        <label id="l-team">Équipe <span class="q-dict-row"><input type="text" id="m-team" maxlength="24" placeholder="Nom de l'équipe"><button type="button" id="btn-dict-team" class="dict-btn" aria-label="Dicter" title="🎤 Dicter"><img class="cur-icon" src="img/icons/micro.svg" alt=""></button></span></label>
        <label id="l-device">Appareil<select id="m-device">
          <option value="Android">Android</option><option value="iPhone">iPhone</option>
          <option value="Tablette">Tablette</option><option value="Ordinateur">Ordinateur</option>
        </select></label>
        <label id="l-browser">Navigateur<select id="m-browser">
          <option value="Chrome">Chrome</option><option value="Safari">Safari</option>
          <option value="Firefox">Firefox</option><option value="Edge">Edge</option><option value="Autre">Autre</option>
        </select></label>
        <label id="l-role">Rôle<select id="m-role">
          <option value="participant">Participant / équipe</option>
          <option value="organizer">Organisateur (tableau de bord)</option>
          <option value="both">Les deux</option>
        </select></label>
        <label id="l-place">Lieu<select id="m-place">
          <option value="site">Sur le site (en vrai)</option>
          <option value="local">En local (PC)</option>
          <option value="home">Test à la maison</option>
          <option value="other">Autre</option>
        </select></label>
        <label id="l-conn">Connexion<select id="m-conn">
          <option value="wifi">Wi-Fi du site</option>
          <option value="4g">4G/5G</option>
          <option value="offline">Hors-ligne</option>
          <option value="local">PC local</option>
        </select></label>
        <label id="l-lang">Langue de l'app<input type="text" id="m-lang" readonly></label>
        <label id="l-ver">Version<input type="text" id="m-ver" readonly></label>
      </div>
    </section>

    <form id="q-form"></form>

    <div class="q-actions">
      <button class="btn btn-primary btn-big" type="button" id="btn-submit">📤 Envoyer mes réponses</button>
      <button class="btn btn-outline hidden" type="button" id="btn-copy">📋 Copier le rapport</button>
    </div>
    <pre id="q-report" class="q-report hidden"></pre>
    <div id="q-done" class="q-done hidden"></div>
  </main>

  <script src="js/engine.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/dict.js"></script>
  <script src="js/questionnaire.js"></script>
</body>
</html>
