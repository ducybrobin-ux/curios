<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c3b2e">
  <title>Curi🧭s — Atelier de packs</title>
  <link rel="icon" href="img/icon.svg">
  <link rel="stylesheet" href="css/curios-tokens.css">
  <link rel="stylesheet" href="css/curios-design-system.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { padding-bottom: 40px; }
    .topbar h1 { font-size: 17px; }
    .ed-title { margin: 0 0 4px; font-size: 24px; }
    .ed-sub { color: var(--text-muted); margin: 0 0 16px; font-size: 15px; }
    .sec-title { margin: 22px 0 8px; font-size: 19px; }
    .ed-card {
      background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px; box-shadow: var(--shadow); margin: 10px 0;
    }
    .ed-card h2 { margin: 0 0 4px; font-size: 17px; }
    .ed-card .ed-id { color: var(--text-muted); font-size: 13px; font-weight: 700; margin: 0 0 12px; }
    .field { margin-bottom: 10px; flex: 1 1 auto; min-width: 110px; }
    .field label { display: block; font-weight: 800; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
    .field input[type="text"], .field input[type="number"], .field textarea, .field input[type="color"], .field select {
      width: 100%; padding: 10px 12px; border-radius: 10px; box-sizing: border-box;
      border: 2px solid var(--line); background: var(--card);
      color: var(--ink); font-family: inherit; font-size: 15px;
    }
    .field input[type="color"] { height: 44px; padding: 4px; }
    .field textarea { resize: vertical; min-height: 60px; }
    .field input:focus, .field textarea:focus, .field select:focus { outline: 3px solid var(--primary); border-color: var(--primary); }
    .field small { display: block; margin-top: 4px; }
    .field-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .diff-block { border: 2px dashed var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 12px; background: var(--card-soft); }
    .diff-block h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--primary); }
    .quiz-q { border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0; background: var(--card); }
    .quiz-q .q-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .quiz-q .q-head b { font-size: 14px; }
    .quiz-q .btn { margin: 0; padding: 6px 10px; font-size: 13px; }
    .quiz-q .field-row input[type="radio"] { width: 20px; height: 20px; accent-color: var(--primary); }
    .ed-adv { border: 2px dashed var(--line); border-radius: 10px; padding: 8px 12px; margin: 10px 0; background: var(--card-soft); }
    .ed-adv summary { cursor: pointer; font-weight: 800; font-size: 13px; color: var(--text-muted); }
    .ed-adv[open] summary { margin-bottom: 8px; }
    details.ed-card summary { cursor: pointer; font-size: 17px; font-weight: 800; }
    details.ed-card[open] summary { margin-bottom: 10px; }
    details.ed-card summary .ed-remove-btn { float: right; margin: -2px 0 0 8px; padding: 4px 8px; font-size: 13px; background: var(--err); color:#fff; }
    details.ed-card summary .ed-remove-btn:hover { filter: brightness(1.1); }
    .at-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .at-toolbar .btn, .at-toolbar a.btn { margin: 0; padding: 9px 12px; font-size: 13px; text-decoration: none; display:inline-flex; align-items:center; }
    #at-status { min-height: 24px; font-weight: 700; margin: 10px 0; white-space: pre-line; }
    #at-status.ok { color: var(--primary); }
    #at-status.err { color: var(--err); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="cur-nav" data-nav-current="creer"></div>
  <header class="topbar">
    <img class="topbar-logo" src="img/logo.svg" alt="Curi🧭s">
    <h1>Curi🧭s — Atelier de packs</h1>
    <button class="icon-btn" title="Éditeur de contenu" onclick="location.href='editeur.html'">🖊️</button>
    <button class="icon-btn" title="Recharger" onclick="location.reload()">🔄</button>
  </header>

  <main style="max-width:680px; margin:0 auto; padding:16px;">

    <h2 class="ed-title">🧩 Créer un pack de contenu</h2>
    <p class="ed-sub">Composez vos découvertes, notions du guide et balises avec leurs objectifs pédagogiques et tranches d'âge. Exportez le bundle puis installez-le dans le projet : <code>node tools/import-pack.mjs mon-pack.jdpbc.json</code></p>

    <div id="at-status" class="status-pill"></div>

    <div class="at-toolbar">
      <button id="btn-new" class="btn btn-outline">🆕 Nouveau pack</button>
      <button id="btn-exemple" class="btn btn-outline">✨ Pack d'exemple</button>
      <button id="btn-import" class="btn btn-outline">📤 Importer un bundle</button>
      <input type="file" id="import-file" accept="application/json,.json" class="hidden">
      <button id="btn-check" class="btn btn-outline">🔎 Vérifier</button>
      <button id="btn-preview" class="btn btn-outline">👁️ Aperçu</button>
      <button id="btn-export" class="btn btn-outline">📥 Exporter le bundle</button>
      <a class="btn btn-outline" href="index.html">👀 Aperçu app</a>
    </div>

    <div id="pack-root"></div>
    <div id="lists-root"></div>
    <pre id="at-preview" class="hidden" style="background:var(--bg,#111);color:var(--ink,#eee);padding:12px;border-radius:8px;margin:16px 0;white-space:pre-wrap;font-size:13px;max-height:400px;overflow-y:auto"></pre>

  </main>

  <script src="js/atelier.js"></script>
  <script src="js/nav-shell.js"></script>
</body>
</html>
